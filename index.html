<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Диспетчер Лида Бир Транс</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1a1d21;--mut:#6b7280;--acc:#d97706;--bd:#e5e7eb;--ok:#16a34a;--bad:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1b1f25;--tx:#f1f3f5;--mut:#9aa3af;--bd:#2a3039}}
*{box-sizing:border-box}
body{margin:0 auto;font:16px/1.35 -apple-system,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--tx);max-width:640px;padding-bottom:90px}
#h{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
.hr{display:flex;justify-content:space-between;font-size:17px}.hr.s{font-size:13px;color:var(--mut);margin-top:4px}
#b{padding:12px 14px}
h2{font-size:16px;margin:16px 0 8px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.c.t{cursor:pointer}.r{display:flex;justify-content:space-between;align-items:center;gap:10px}
.n{font-weight:600}.m{color:var(--mut);font-size:13px}
.pay{color:var(--ok);font-weight:700}
.chip{font-size:12px;padding:3px 9px;border-radius:12px;background:var(--bg);white-space:nowrap}
.btn{display:block;width:100%;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:16px;font-weight:600;margin-top:8px}
.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.btn[disabled]{opacity:.4}
.bad{color:var(--bad)}.ok{color:var(--ok)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0)}
nav a{flex:1;text-align:center;padding:8px 0;font-size:11px;color:var(--mut)}nav a b{display:block;font-size:20px;font-weight:400}
nav a.on{color:var(--acc)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end}
.sh{background:var(--bg);width:100%;max-width:640px;margin:auto;max-height:80vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px}
.ev{font-size:13px;color:var(--mut);padding:4px 0;border-bottom:1px solid var(--bd)}
.bar{height:6px;border-radius:3px;background:var(--bg);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.tag{display:inline-block;font-size:11px;padding:2px 6px;border-radius:6px;background:var(--bg);margin-right:4px}
</style>
</head>
<body>
<div id="h"></div><div id="b"></div><nav id="n"></nav><div id="m"></div>
<script>
var TG=window.Telegram&&Telegram.WebApp;
if(TG){try{TG.ready();TG.expand()}catch(e){}}
function f(n){return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g," ")}
function R(a,b){return a+Math.floor(Math.random()*(b-a+1))}

var T=[
[1,"Volvo FM",380,.90,"i","Александр Федорович (Алик)",0,"w","9179 AB-4","volvo","by","FM"],
[2,"Volvo FM",380,.90,"i","Валентин",0,"w","1111 AE-4","volvo","by","FM"],
[3,"Volvo FH12",420,.93,"i","Чесь Чапля",0,"b","0014 AB-4","volvo","by","высокая"],
[4,"Volvo FH3 Classic",420,.93,"i","",1,"b","1255 AE-4","volvo","by","—"],
[5,"Volvo FH3 Classic",460,.93,"i","Гена Жилинский",0,"y","8222 AB-4","volvo","by","Globetrotter"],
[6,"Volvo FH3 Classic",460,.93,"i","Миша Женко",0,"y","9617 AK-4","volvo","by","Globetrotter"],
[7,"Volvo FH3 Classic",460,.93,"i","Тад Ословский",0,"y","8332 AB-4","volvo","by","Globetrotter"],
[8,"Volvo FH12 XL",460,.93,"i","Олег Кириленко",0,"y","5797 AB-4","volvo","by","Globetrotter XL"],
[9,"DAF XF105 Space Cab",460,.92,"i","",3,"w","AX 0125-4","daf","by","Space"],
[10,"DAF XF105 Space Cab",460,.92,"i","Юзик",0,"w","5233 AE-4","daf","by","Space"],
[11,"DAF XF105 Super Space Cab",460,.92,"i","Беляк",0,"w","AE 5233-4","daf","by","Super Space"],
[12,"DAF XF105 Space Cab",460,.92,"i","Паша Ословский",0,"w","AK 8183-4","daf","by","Space"],
[13,"DAF XF105 Space Cab",460,.92,"i","",1,"w","—","daf","by","Space"],
[14,"DAF XF105 Space Cab",460,.92,"i","Шиманец",0,"y","1047 AI-4","daf","by","Space"],
[15,"DAF XF105 Space Cab",460,.92,"i","",1,"y","8013 AB-4","daf","by","Space"],
[16,"DAF XF105 Super Space Cab",460,.92,"i","Вова Бжезинский",0,"y","—","daf","by","Super Space"],
[17,"Dongfeng GX",520,.96,"t","Артур",0,"w","—","dongfeng","ru","GX"],
[18,"Dongfeng GX",520,.96,"t","Василич",0,"w","—","dongfeng","ru","GX"],
[19,"Dongfeng GX",520,.96,"t","",1,"w","—","dongfeng","ru","GX"],
[20,"Dongfeng GX",520,.96,"t","",1,"w","—","dongfeng","ru","GX"],
[21,"Dongfeng GX",520,.96,"t","Ясюлевич",0,"t","AH 7721-4","dongfeng","ru","GX"],
[22,"КАМАЗ-54901 (К5)",450,.95,"t","Саня Сазанович",0,"g","4889 AH-4","kamaz","by","К5"],
[23,"КАМАЗ-54901 (К5)",450,.95,"t","",1,"w","AH 3219-4","kamaz","ru","К5 бренд"],
[24,"КАМАЗ-5490 Neo",401,.90,"i","",1,"w","1973 AM-4","kamaz","by","Neo"],
[25,"Scania R Highline",450,.94,"i","",1,"w","5253 AE-4","scania","by","Highline"],
[26,"Iveco Stralis II",440,.90,"i","Кузя",0,"w","—","iveco","by","Hi-Road"],
[27,"Renault T-Range",440,.91,"t","",1,"b","7094 AX-4","renault","by","высокая"]
];

var BY=[
["Минск",[["Бехтерева 10",225],["Прилесье",235],["Озеро",194]]],
["Гомель",[["Склад",512],["Стеклозавод",514]]],
["Брест",[["Склад",330]]],
["Витебск",[["Ленинградская 138",472]]],
["Могилёв",[["Челюскинцев 95Б/1",423]]],
["Гродно",[["Склад",140]]],
["Барановичи",[["Склад",138]]],
["Бобруйск",[["Легпромразвитие",368]]],
["Скидель",[["Сахарный завод",138]]],
["Полоцк",[["Склад",390]]],
["Новополоцк",[["Склад",395]]],
["Заславль",[["Советская 128А",180]]]
];
var RU=[
["Смоленск",[["Склад",650]]],
["Москва",[["Склад",900]]],
["Брянск",[["Склад",750]]],
["Калуга",[["Склад",850]]],
["Тверь",[["Склад",950]]],
["Санкт-Петербург",[["Склад",1100]]]
];
var CARGO_BY=[
["Пиво «Лидское» Premium","i","Лидский пивзавод"],
["Пиво «Лидское» Pilsner","i","Лидский пивзавод"],
["Квас «Лидский»","i","Лидский пивзавод"],
["Газировка Pepsi","i","Лидский пивзавод"],
["Сидр FIZZ","i","Лидский пивзавод"],
["Вода «Aura»","i","Лидский пивзавод"],
["Мебель (Толстого)","t","Склад Толстого"],
["Холодильники (Толстого)","t","Склад Толстого"],
["Продукция (Фурманова)","i","Склад Фурманова"]
];
var CARGO_RU=[
["Пиво «Лидское»","t","Лидский пивзавод"],
["Квас «Лидский»","t","Лидский пивзавод"],
["Поддоны","t","Склад"]
];

var S,KEY="lbt_v4";
function nw(){return{
day:1,money:5000,rep:50,orders:[],trips:[],log:[],
tr:T.map(function(t){return{id:t[0],dr:t[5],st:t[6],fat:0,busy:0,task:null,endTime:0,stage:"",progress:0}}),
oid:1,stats:{done:0,earn:0},lastWave:0,checkedDay:0
}}

function load(){
  try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
  if(!S||!S.tr)S=nw();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function ti(id){return T.filter(function(t){return t[0]==id})[0]}
function ts(id){return S.tr.filter(function(s){return s.id==id})[0]}
function log(x){S.log.unshift("["+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+"] "+x);S.log=S.log.slice(0,60)}

// --- ГЕНЕРАЦИЯ ЗАЯВОК ---
function genWave(count){
  for(var i=0;i<count;i++){
    var isRU=Math.random()<0.15;
    var pool=isRU?RU:BY;
    var c=pool[R(0,pool.length-1)];
    var pt=c[1][R(0,c[1].length-1)];
    var cargo=isRU?CARGO_RU[R(0,CARGO_RU.length-1)]:CARGO_BY[R(0,CARGO_BY.length-1)];
    var rate=isRU?0.40:1.50;
    var urgent=Math.random()<0.1;
    S.orders.push({id:S.oid++,city:c[0],point:pt[0],km:pt[1],ru:isRU,g:cargo[0],type:cargo[1],from:cargo[2],pay:Math.round(pt[1]*rate*(urgent?1.3:1)),urgent:urgent});
  }
}

// --- РАСЧЕТ ВРЕМЕНИ РЕЙСА ---
function assign(tid,oid){
  var o=S.orders.filter(function(x){return x.id==oid})[0];
  var s=ts(tid),t=ti(tid);
  
  if(!o||!s||s.busy||s.st!=0)return;
  if(o.ru&&t[10]!="ru"){TG.showAlert("В Россию ходят только Dongfeng и КАМАЗ №23!");return;}
  if(!o.ru&&t[10]=="ru"){TG.showAlert("Эти машины работают только по России!");return;}
  if(t[4]!=o.type){TG.showAlert("Не тот прицеп! Нужен "+(o.type=="i"?"изотерм":"тент"));return;}

  // Время: Погрузка (2ч) + Дорога (60 км/ч) + Выгрузка (2ч)
  var loadH = 2; 
  var driveH = Math.round(o.km / 60); 
  var unloadH = 2;
  var totalHours = loadH + driveH + unloadH;
  
  // Ускорение для теста (1 час игры = 1 минута реального времени)
  // Для реального времени: 1 час = 60 * 60 * 1000 мс. 
  // Пока ставим 1 час = 1 минута (чтобы не ждать сутками), потом можно увеличить.
  var MS_PER_HOUR = 60 * 1000; 

  s.busy = 1;
  s.task = {o:o, stage:"Загрузка", endTime: Date.now() + (loadH*MS_PER_HOUR), totalHours:totalHours, driveH:driveH, loadH:loadH, unloadH:unloadH, msPerHour:MS_PER_HOUR};
  
  S.orders = S.orders.filter(function(x){return x.id!=oid});
  log("▶ "+s.dr+" выехал на загрузку ("+o.from+"). Рейс: "+o.city);
  save();render();
}

// --- ОБНОВЛЕНИЕ ВРЕМЕНИ (ТИК) ---
function tick(){
  var now = Date.now();
  var nowDate = new Date();
  var h = nowDate.getHours();
  
  // День считается новым в 06:00 утра
  if(h >= 6 && S.checkedDay !== nowDate.getDate()){
    if(S.day > 1) { // не первый день
      S.money -= S.tr.filter(function(s){return s.st==0&&s.dr}).length * 45; // Расходы
    }
    S.day++;
    S.checkedDay = nowDate.getDate();
  }

  // Волны заявок по реальному времени
  if(h === 6 && S.lastWave !== 6){ genWave(15); S.lastWave=6; log("📨 Пришла утренняя волна (15 заявок)"); }
  if(h === 14 && S.lastWave !== 14){ genWave(5); S.lastWave=14; log("📨 Пришла дневная волна (5 заявок)"); }
  if(h === 17 && S.lastWave !== 17){ genWave(10); S.lastWave=17; log("📨 Пришла вечерняя волна (10 заявок)"); }

  // Движение машин
  var changed = false;
  S.tr.forEach(function(s){
    if(!s.busy || !s.task) return;
    var t = s.task;
    
    if(now >= t.endTime){
      if(t.stage === "Загрузка"){
        t.stage = "В пути";
        t.endTime = now + (t.driveH * t.msPerHour);
        changed = true;
      } else if(t.stage === "В пути"){
        t.stage = "Выгрузка";
        t.endTime = now + (t.unloadH * t.msPerHour);
        changed = true;
      } else if(t.stage === "Выгрузка"){
        // Рейс завершен
        s.busy = 0;
        s.task = null;
        var o = t.o;
        var driverPay = Math.round(o.km * 0.167);
        var fuel = Math.round(o.km * 0.30 * 2.4);
        S.money += o.pay;
        S.stats.done++;
        S.stats.earn += o.pay;
        log("✅ "+s.dr+" завершил рейс в "+o.city+". Выручка: "+f(o.pay)+" Br.");
        changed = true;
      }
    }
  });

  if(changed) save();
  render(); // перерисовываем экран каждую секунду
}

// --- UI ---
var H=document.getElementById("h"),B=document.getElementById("b"),N=document.getElementById("n"),M=document.getElementById("m");

function render(){
  var d = new Date();
  var timeStr = d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  
  H.innerHTML='<div class="hr"><b>📅 День '+S.day+' · '+timeStr+'</b><b>💰 '+f(S.money)+' Br</b></div><div class="hr s"><span>⭐ '+S.rep+'</span><span>Заявок: '+S.orders.length+'</span><span>В рейсе: '+S.tr.filter(function(x){return x.busy}).length+'</span></div>';
  
  navb();
  
  if(S.tab=="o")screenOrders();
  else if(S.tab=="f")screenFleet();
  else if(S.tab=="t")screenTrips();
  else screenLog();
}

function navb(){
  var L=[["o","📦","Заявки"],["f","🚛","Парк"],["t","🛣","В рейсе"],["l","📋","Журнал"]];
  N.innerHTML=L.map(function(t){return '<a class="'+(S.tab==t[0]?"on":"")+'" onclick="tab(\''+t[0]+'\')"><b>'+t[1]+'</b>'+t[2]+'</a>'}).join("");
}
function tab(x){S.tab=x;save();render()}

function screenOrders(){
  var h='<h2 style="margin-top:0">Заявки ('+S.orders.length+')</h2>';
  if(!S.orders.length)h+='<div class="c m">Заявок нет. Жди 06:00, 14:00 или 17:00.</div>';
  S.orders.forEach(function(o){
    h+='<div class="c t" onclick="pick('+o.id+')"><div class="r"><span class="n">'+o.from+' → '+o.city+' ('+o.point+')</span><span class="pay">'+f(o.pay)+' Br</span></div><div class="m">'+(o.urgent?'<span class="tag bad">СРОЧНО</span>':'')+o.g+' · '+(o.type=="i"?"изотерм":"тент")+' · '+o.km+' км'+(o.ru?' · 🇷🇺':'')+'</div></div>';
  });
  B.innerHTML=h;
}

function pick(oid){
  var o=S.orders.filter(function(x){return x.id==oid})[0];
  var free=S.tr.filter(function(s){return s.st==0&&!s.busy});
  var h='<div class="n">'+o.from+' → '+o.city+'</div><div class="m">'+o.g+' · '+o.km+' км · '+f(o.pay)+' Br</div>';
  if(!free.length)h+='<div class="c m" style="margin-top:10px">Все машины заняты.</div>';
  free.forEach(function(s){
    var t=ti(s.id);
    h+='<div class="c t" style="margin-top:10px" onclick="assign('+s.id+','+oid+');closeModal()"><div class="r"><span class="n">'+s.dr+' · '+t[1]+' №'+s.id+'</span><span class="chip">'+(t[4]=="i"?"изотерм":"тент")+'</span></div></div>';
  });
  modal(h);
}

function screenFleet(){
  var h='<h2 style="margin-top:0">Автопарк</h2>';
  var fam={volvo:"🇸🇪 Volvo",daf:"🇳🇱 DAF",dongfeng:"🇨🇳 Dongfeng",kamaz:"🇷🇺 КАМАЗ",scania:"🇸🇪 Scania",iveco:"🇮🇹 Iveco",renault:"🇫🇷 Renault"};
  ["volvo","daf","dongfeng","kamaz","scania","iveco","renault"].forEach(function(k){
    var list=S.tr.filter(function(s){return ti(s.id)[9]==k});
    if(!list.length)return;
    h+='<h2>'+fam[k]+'</h2>';
    list.forEach(function(s){
      var t=ti(s.id);
      var st="Свободен";
      if(s.busy) st=s.task.stage;
      else if(s.st==1) st="Нет водителя";
      else if(s.st==3) st="Ремонт";
      
      h+='<div class="c"><div class="r"><div><div class="n">'+t[1]+' №'+s.id+'</div><div class="m">'+(s.dr||"—")+' · '+t[8]+'</div></div><span class="chip">'+st+'</span></div></div>';
    });
  });
  B.innerHTML=h;
}

function screenTrips(){
  var h='<h2 style="margin-top:0">Машины на линии</h2>';
  var busy=S.tr.filter(function(s){return s.busy});
  if(!busy.length)h+='<div class="c m">Все стоят на базе.</div>';
  
  busy.forEach(function(s){
    var t=ti(s.id), task=s.task;
    var stageText = task.stage;
    if(task.stage=="Загрузка") stageText = "Грузится в "+task.o.from;
    if(task.stage=="В пути") stageText = "Едет в "+task.o.city;
    if(task.stage=="Выгрузка") stageText = "Выгружается в "+task.o.city;
    
    h+='<div class="c"><div class="r"><span class="n">'+s.dr+' · '+t[1]+'</span><span class="chip">'+stageText+'</span></div><div class="m">Клиент: '+task.o.city+', '+task.o.point+'</div></div>';
  });
  B.innerHTML=h;
}

function screenLog(){
  var h='<h2 style="margin-top:0">Журнал</h2>';
  S.log.forEach(function(x){h+='<div class="ev">'+x+'</div>'});
  B.innerHTML=h;
}

function modal(h){M.innerHTML='<div class="ov" onclick="if(event.target==this)closeModal()"><div class="sh">'+h+'<button class="btn g" onclick="closeModal()">Закрыть</button></div></div>'}
function closeModal(){M.innerHTML=""}

// --- СТАРТ ---
load();
S.tab=S.tab||"o";
// Запускаем тик каждую секунду
setInterval(tick, 1000);
render();
</script>
</body>
</html>
